name: globaly
description: Global Helper — your companion for moving, studying, and living abroad.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Routing
  go_router: ^14.2.7

  # DI (manual registration — no codegen needed)
  get_it: ^7.7.0

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  internet_connection_checker_plus: ^2.5.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Social sign-in (federated providers layered on Firebase Auth)
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  # Nonce hashing for Apple + OTP code hashing before it touches Firestore.
  crypto: ^3.0.5

  # Local storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Functional + utils
  dartz: ^0.10.1
  intl: ^0.20.2
  logger: ^2.4.0

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3

  # Misc
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0

  # Open-source map (OSM tiles, no API key required)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Modern icon set — Phosphor (line/bold/duotone variants).
  phosphor_flutter: ^2.1.0

  # First-run feature walkthroughs (coach marks).
  tutorial_coach_mark: ^1.2.12
  # OCR vaqtinchalik o'chirildi (Firebase iOS SDK bilan to'qnashuv).
  # Keyin Cloud Vision API yoki Tesseract'ga ulanadi.
  # google_mlkit_text_recognition: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    # Bundled so API keys load at runtime even without --dart-define.
    - .env.json
